# Runs the money checks (Loyverse import, statement, commission, safe edits) on every PR and
# on main. A red check means a change would give wrong numbers: don't merge until it is green.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
